name: Build and deploy mxsite to HK VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_ENV: production
  HUGO_VERSION: "0.162.1"
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          curl -fsSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go (for Hugo modules)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build site
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_PORT="${{ secrets.SSH_PORT }}"
          ssh-keyscan -H -p "${SSH_PORT:-22}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          rsync -avz --delete --human-readable \
            -e "ssh -p ${PORT} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            public/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
